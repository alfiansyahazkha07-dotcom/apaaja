<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌙 Selamat Berpuasa! 🌙</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0B1926, #1A3B5C);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 60px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.4);
            max-width: 550px;
            width: 100%;
            position: relative;
            border: 3px solid #C9A959;
            animation: muncul 1s ease-out;
            z-index: 10;
        }

        @keyframes muncul {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hiasan-bulan {
            position: absolute;
            top: -50px;
            right: -30px;
            font-size: 120px;
            animation: melayang 4s ease-in-out infinite;
            filter: drop-shadow(0 10px 20px rgba(255, 215, 0, 0.5));
            transform: rotate(15deg);
        }

        @keyframes melayang {
            0%, 100% { transform: translateY(0) rotate(15deg); }
            50% { transform: translateY(-20px) rotate(20deg); }
        }

        h1 {
            color: #0B1926;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 700;
        }

        .profile-section {
            background: linear-gradient(135deg, #F8E3B3, #FFE5B4);
            padding: 25px;
            border-radius: 30px;
            margin-bottom: 30px;
            text-align: center;
        }

        .profile-section p {
            font-size: 1.2em;
            color: #1A3B5C;
            line-height: 1.8;
        }

        .timer-container {
            text-align: center;
            background: #1A3B5C;
            padding: 20px;
            border-radius: 30px;
            margin: 30px 0;
        }

        .timer-label {
            color: #FFD966;
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        #countdown {
            font-size: 64px;
            color: white;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 20px #FFD966;
            letter-spacing: 5px;
        }

        .button-container {
            display: flex;
            justify-content: center;
            margin: 30px 0;
        }

        .btn-ucapan {
            background: linear-gradient(135deg, #C9A959, #B8860B);
            color: white;
            border: none;
            padding: 20px 50px;
            border-radius: 50px;
            font-size: 1.5em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 20px rgba(184, 134, 11, 0.3);
        }

        .btn-ucapan:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(184, 134, 11, 0.5);
        }

        .message-box {
            background: rgba(255, 255, 255, 0.9);
            border-left: 8px solid #C9A959;
            padding: 20px;
            border-radius: 20px;
            margin-top: 30px;
            font-size: 1.1em;
            color: #1A3B5C;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        .floating-photo {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            animation: terbangFoto 5s ease-out forwards;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
            max-width: 200px;
            max-height: 200px;
            object-fit: contain;
        }

        @keyframes terbangFoto {
            0% {
                transform: translateY(100vh) scale(0.5) rotate(0deg);
                opacity: 1;
            }
            30% {
                transform: translateY(70vh) scale(1.2) rotate(10deg);
                opacity: 0.95;
            }
            60% {
                transform: translateY(40vh) scale(1.4) rotate(-10deg);
                opacity: 0.9;
            }
            100% {
                transform: translateY(-20vh) scale(0.8) rotate(20deg);
                opacity: 0;
            }
        }

        .footer-note {
            text-align: center;
            color: #666;
            margin-top: 40px;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .card {
                padding: 25px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            #countdown {
                font-size: 48px;
            }
            
            .btn-ucapan {
                font-size: 1.2em;
                padding: 15px 30px;
            }
            
            .floating-photo {
                max-width: 120px;
                max-height: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="hiasan-bulan">🌙</div>
    
    <div class="card">
        <h1>✨ SELAMAT BERPUASA! ✨</h1>
        
        <div class="profile-section">
            <p>Untuk: <strong>KAMU</strong></p>
            <p>Semoga puasamu lancar sampai maghrib!</p>
        </div>

        <!-- Countdown -->
        <div class="timer-container">
            <div class="timer-label">⏰ Menuju Maghrib</div>
            <div id="countdown">05:00:00</div>
        </div>

        <!-- Single Button -->
        <div class="button-container">
            <button class="btn-ucapan" onclick="kasihUcapanBalik()">
                <span>💬</span> Kasih Ucapan Balik
            </button>
        </div>

        <!-- Message Area -->
        <div id="prankMessage" class="message-box"></div>

        <div class="footer-note">
            *Website ini dibuat untuk hiburan 😊
        </div>
    </div>

    <script>
        // ===== TEMPAT MASUKIN FOTO FOTO DI SINI =====
        // GANTI URL DI BAWAH INI DENGAN FOTO FOTO YANG MAU DIPAKAI
        const photoList = [
            // ISI DENGAN URL FOTO ASLI
           
            "https://dcostseafood.id/product/es-jeruk-peras/" 
            "jrk.jpeg"
            "sblk.jpeg"
            "tlr.jpg"
        ];

        // Countdown timer
        function updateCountdown() {
            const now = new Date();
            const maghrib = new Date();
            maghrib.setHours(18, 0, 0);
            
            let diff = maghrib - now;
            
            if (diff < 0) {
                diff = 5 * 60 * 60 * 1000;
            }
            
            const hours = Math.floor(diff / (60 * 60 * 1000));
            const minutes = Math.floor((diff % (60 * 60 * 1000)) / (60 * 1000));
            const seconds = Math.floor((diff % (60 * 1000)) / 1000);
            
            document.getElementById('countdown').innerHTML = 
                `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        setInterval(updateCountdown, 1000);

        // FUNGSI PRANK: Kasih Ucapan Balik
        function kasihUcapanBalik() {
            // Getar HP
            if (navigator.vibrate) {
                navigator.vibrate(200);
            }
            
            // Kirim 20-30 foto melayang
            const jumlahFoto = Math.floor(Math.random() * 11) + 20; // 20-30 foto
            
            for (let i = 0; i < jumlahFoto; i++) {
                setTimeout(() => {
                    // Pilih random foto dari photoList
                    const randomPhoto = photoList[Math.floor(Math.random() * photoList.length)];
                    createFloatingPhoto(randomPhoto);
                    
                    // Getar setiap 5 foto
                    if (i % 5 === 0 && navigator.vibrate) {
                        navigator.vibrate(50);
                    }
                    
                }, i * 200);
            }
            
            // Pesan setelah selesai
            setTimeout(() => {
                showPrankMessage("✅ Ucapan balik sudah dikirim! " + jumlahFoto + " foto!");
            }, jumlahFoto * 200 + 500);
        }

        // Fungsi bikin foto melayang
        function createFloatingPhoto(photoUrl) {
            const img = document.createElement('img');
            img.className = 'floating-photo';
            img.src = photoUrl;
            
            // Posisi random
            img.style.left = Math.random() * 80 + '%';
            
            // Ukuran random
            const size = Math.floor(Math.random() * 100) + 100; // 100-200px
            img.style.width = size + 'px';
            img.style.height = size + 'px';
            
            // Kecepatan random
            const duration = Math.floor(Math.random() * 4) + 4; // 4-8 detik
            img.style.animationDuration = duration + 's';
            
            document.body.appendChild(img);
            
            // Hapus setelah animasi selesai
            setTimeout(() => {
                img.remove();
            }, duration * 1000);
        }

        function showPrankMessage(msg) {
            const messageDiv = document.getElementById('prankMessage');
            messageDiv.style.display = 'block';
            messageDiv.innerHTML = msg;
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 2000);
        }
    </script>
</body>
</html>
